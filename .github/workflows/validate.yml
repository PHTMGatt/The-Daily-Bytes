name: Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [chatgpt-forge]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test and build
        run: npm run build
